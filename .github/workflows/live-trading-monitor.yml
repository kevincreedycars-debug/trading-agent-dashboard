# Monitoring that does not live on the machine it watches. The dashboard shows results, so a terminal that died,
# a trader that stopped and a publisher that stalled all look identical there - and when the trading host is off
# or unreachable, nothing on it can report that it is off. This runs in GitHub's cloud every fifteen minutes and
# asks the published URLs, which is the one place the answer exists whether the host is up or not:
#
# GitHub honours that cadence unevenly in practice - 39 runs in the 7.5 days to 2026-11-02, about five a day - so
# read this as a periodic check with hours of resolution, not as fifteen-minute alerting.
#
#   node scripts/check-live-trading-publication.js   exit 0 fresh, 1 stale or identity-mismatched, 2 unreadable
#
# Its allowances are the checker's own defaults - 1800s for a snapshot and 1800s for a heartbeat - and this workflow
# deliberately passes no tighter ones. They are set against the publish cycle, not against the page's badge: the lanes
# publisher repeats on a 600s task with a --min-interval-seconds of 600, so a tick landing inside that gate is refused
# and the following tick carries the publish, which makes the cycle that actually serves the page 1200s. A heartbeat
# is read at publish time and can be a 300s bar old already. When these were 900s, borrowed from the snapshot's own
# stale_after_seconds, a healthy pipeline went red on a schedule and the email was the only thing anyone read; see
# docs/live-trading/DAILY_ALERT_EMAILS_20261107.md for the runs and the ages they carried.
#
# The job's own failure is the alert: a red run appears in the Actions list and GitHub's default notifications
# email the repository owner for a failed scheduled workflow. It writes nothing, holds no credential and cannot
# send anything, so a false alarm costs a red run and never a trade.
#
# Before the trading host exists, a red run here means the PC is asleep - which is the truth this is meant to
# tell, and the reason the monitor is worth having before the migration rather than after it.
name: live-trading-monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# A slow run must not stack up behind itself; the next slot supersedes it, because this job only ever reads.
concurrency:
  group: live-trading-monitor
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the checker at this commit
        uses: actions/checkout@v4
        with:
          # No credential is left behind in the checkout: this job never pushes.
          persist-credentials: false

      - name: Use the runtime the repository uses
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --json because the summary is what a person reads on a phone at 03:00 and the run log keeps the same
      # evidence for a diff. One request per lane, not two: the human report and the JSON say the same thing,
      # and asking twice invites a disagreement between them. The exit code is kept, because it is the alarm.
      - name: Ask the published URLs whether each lane is alive
        run: |
          set -o pipefail
          status=0
          node scripts/check-live-trading-publication.js --json | tee report.json || status=$?
          {
            echo "## live trading publication check"
            echo ""
            echo "exit code ${status}: 0 fresh, 1 stale or identity mismatch, 2 lanes document unreadable"
            echo "allowance: a 1800s snapshot and a 1800s heartbeat, against a 1200s publish cycle plus a bar and a margin"
            echo ""
            echo '```json'
            cat report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
