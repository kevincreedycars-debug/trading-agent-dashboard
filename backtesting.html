<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backtesting | Trading Agent Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b141c;color:#ecf3f4;font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
header,main{max-width:1180px;margin:auto;padding:18px clamp(14px,4vw,40px)}
header{border-bottom:1px solid #30424e;display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
a{color:#96dbd1;text-underline-offset:3px}
h1{font-size:clamp(28px,5vw,46px);line-height:1.05;letter-spacing:-.04em;margin:20px 0 8px}
h2{font-size:22px;margin:0 0 10px}
h3{font-size:17px;margin:18px 0 8px}
p{margin:6px 0 12px;color:#b9cbd1}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}
nav.tabs a,button{font:inherit;color:#dce8e9;background:#162530;border:1px solid #3d515c;border-radius:6px;padding:7px 12px;text-decoration:none;cursor:pointer}
nav.tabs a[aria-current=page],button[aria-pressed=true]{background:#a9e5d8;color:#102a28;border-color:#a9e5d8}
section{border-top:1px solid #34454e;padding:20px 0}
details{border:1px solid #2f434e;border-radius:8px;background:#101e27;padding:10px 14px;margin:10px 0}
summary{cursor:pointer;font-weight:650}
:focus-visible{outline:3px solid #f4cb79;outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.card{background:#132430;border:1px solid #344c58;border-radius:8px;padding:14px}
.card h3{margin-top:0}
.card small,.caption{display:block;color:#abc6cb;font-size:13px}
.stat{font-size:22px;color:#f4d895;display:block;margin:2px 0}
.banner{border:1px solid #e0a35c;background:#2a2114;border-radius:8px;padding:14px;margin:16px 0}
.banner strong{color:#f7cc86}
.ok{border-color:#69b8a3;background:#12241f}.bad{border-color:#d68b8b;background:#2a1717}
.pill{display:inline-block;font-size:12px;padding:1px 7px;border-radius:20px;border:1px solid #4b6470;color:#cfe3e5;margin-left:4px}
.pill.blocked{background:#421f1f;border-color:#a96060}.pill.valid_abstention{background:#1d3a3a;border-color:#6fb1ad}
.pill.allowed,.pill.scored{background:#1b3a2b;border-color:#6fb589}
.pill.scored_in_legacy_aggregate{background:#3a3419;border-color:#b9a45c}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #2c4049;vertical-align:top}
th{color:#cfe3e5;position:sticky;top:0;background:#0f1c24}
tbody tr:hover{background:#152833}
tbody tr[aria-selected=true]{background:#1d3440}
.scroll{max-height:430px;overflow:auto;border:1px solid #2c4049;border-radius:8px}
.mono,code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}
#map{width:100%;height:320px;display:block;background:#0d1922;border:1px solid #2c4049;border-radius:8px;touch-action:none;cursor:grab}
#map[hidden]{display:none}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{font-size:13px;padding:4px 9px}
ul{margin:6px 0 12px;padding-left:20px}
li{margin:3px 0;color:#c3d4d8}
.caption{margin-top:8px}
.hash{word-break:break-all}
select{font:inherit;color:#dce8e9;background:#162530;border:1px solid #3d515c;border-radius:6px;padding:7px 10px;max-width:100%}
pre{white-space:pre-wrap;word-break:break-word;background:#0d1922;border:1px solid #2c4049;border-radius:6px;padding:8px;font-size:12px;max-height:280px;overflow:auto}
</style></head><body>
<header><b>Trading Agent Dashboard</b><span><a href="index.html">Dashboard</a> · <a href="data/usd-layer1-backtester/backtesting-screen-v1.json">Screen payload</a></span></header>
<main>
<h1>Backtesting</h1>
<p id="subtitle">Loading the evidence behind the 05:00 London USD call…</p>
<div id="blockers" aria-live="polite"></div>
<div class="grid" id="summary" aria-label="Selected models and readiness"></div>
<nav class="tabs" id="tabs" aria-label="Backtesting views"></nav>
<section id="view" aria-live="polite"></section>
<section id="provenance"><h2>Provenance</h2><div id="provenance-body" class="caption"></div></section>
</main>
<script src="lib/vendor/three.min.js"></script>
<script>
"use strict";
const payloadUrl="data/usd-layer1-backtester/backtesting-screen-v1.json";
const tabs={overview:"Overview",architecture:"Architecture",tests:"Tests",ledger:"Decision ledger",audit:"Run audit",decisions:"Decisions",h1:"H1 candidate"};
const state={screen:null,error:null,test:null,rowKey:null,node:null,filter:"all"};
function el(tag,text,parent,cls){const n=document.createElement(tag);if(text!==null&&text!==undefined)n.textContent=text;if(cls)n.className=cls;if(parent)parent.append(n);return n}
function pill(status,parent){return el("span",status,parent,"pill "+status)}
function pct(value){return value===null||value===undefined?"—":value+"%"}
function key(date,test){return test+"|"+date}
function card(parent,title,value,caption,cls){
  const c=el("div",null,parent,"card "+(cls||""));
  el("h3",title,c);
  if(value!==null&&value!==undefined)el("span",value,c,"stat");
  if(caption)el("small",caption,c);
  return c;
}
function renderBlockers(s){
  const host=document.querySelector("#blockers");host.replaceChildren();
  const pkg=s.package_identity;
  const b=el("div",null,host,"banner"+(pkg.status==="PRESENT"?" ok":""));
  el("strong",pkg.status==="PRESENT"?"Requested package present":"Requested package absent: "+pkg.requested,b);
  el("p",pkg.consequence,b);
  if(pkg.blockers&&pkg.blockers.length){const ul=el("ul",null,b);for(const line of pkg.blockers)el("li",line,ul)}
  const d=el("details",null,b);el("summary","Search record ("+pkg.searched.length+" files read on "+pkg.checked_at+")",d);
  const ul2=el("ul",null,d);for(const line of pkg.searched.slice(0,40))el("li",line,ul2,"mono");if(pkg.searched.length>40)el("li","… "+(pkg.searched.length-40)+" more",ul2,"mono");
  const h1=s.h1;
  const h1b=el("div",null,host,"banner"+(h1&&h1.coverage.ready>0?" ok":" bad"));
  el("strong",h1?h1.coverage.label:"H1 historical coverage unavailable",h1b);
  if(h1){
    el("p","Bound to "+h1.model.id+" · "+h1.model.version+" · "+h1.coverage.binding.gate+" · fixtures "+h1.fixtures.label+".",h1b);
    el("p","Package "+h1.package.requested+" · "+h1.package.status+" · commit "+h1.package.package.commit.slice(0,12)+"… · "+h1.package.internal_checksums.verified+"/"+h1.package.internal_checksums.declared+" declared sums · its own verify.js "+h1.package.acceptance.status+" · archive "+h1.package.archive.sha256.slice(0,12)+"…",h1b);
    el("p","Review: "+h1.review.summary.votes+" votes from "+h1.review.summary.adjudications+" adjudications; "+h1.review.summary.discrepancy_count+" findings, "+h1.review.discrepancies.filter(d=>d.status==="recorded_not_applied").length+" recorded for v0.1.1. Audit: "+h1.audit.reconciliation.blocked+" blocked mornings saved once, reconciled "+(h1.audit.reconciliation.reconciled?"yes":"no")+".",h1b);
    el("p","Legacy counts below describe the control and the legacy implemented book. They are not H1 counts and are never presented as H1 coverage.",h1b);
  }else{
    el("p","The H1 coverage audit is missing from this payload. No legacy count is substituted for it.",h1b);
  }
}
function renderSummary(s){
  const host=document.querySelector("#summary");host.replaceChildren();
  const models=s.summary.selected_models;
  for(const model of models){
    const c=card(host,model.role==="control"?"Control":"Candidate",model.id,model.label);
    el("small","version: "+(model.version||"—"),c);
    el("small","rulebook: "+(model.rulebook_version||"—")+" · gate: "+(model.gate_basis||"—"),c);
    if(model.identity){const p=el("p",null,c);pill(model.identity.status,p);el("small",model.identity.note||"",c)}
    const d=el("details",null,c);el("summary","Executable entry points",d);
    const ul=el("ul",null,d);for(const path of model.executable_entry_points)el("li",path,ul,"mono");
  }
  if(s.summary.h1){
    const h=s.summary.h1;
    const c=card(host,"H1 candidate",h.ready+" / "+h.scheduled+" ready",h.label);
    el("small","model: "+h.model_id+" · version: "+h.model_version+" · package "+h.package.commit.slice(0,12)+"… ("+h.package.sums+" sums, verify.js "+h.package.acceptance+")",c);
    el("small","fixtures: "+h.fixture_label+" · earliest eligible: "+(h.earliest_eligible||"none established"),c);
    el("small","review: "+h.review.votes+" votes from "+h.review.adjudications+" adjudications · "+h.review.open+" open findings · audit "+h.audit.saved_decisions+" saved decisions, reconciled "+(h.audit.reconciled?"yes":"no"),c);
    el("small","scoring contract "+h.scoring_contract.status+" on "+h.scoring_contract.frozen_on+" · target "+h.scoring_contract.directional_target_pct+"%",c);
    el("small",h.legacy_replacement.note,c);
  }
  card(host,"Session",s.summary.session,s.summary.first_date+" → "+s.summary.last_date+" · "+s.summary.sessions+" scheduled mornings");
  const r=s.summary.readiness;
  card(host,"Ready / blocked",r.strict_ready_control+" / "+(s.summary.sessions-r.strict_ready_control),"strict gate, both models · narrow control "+r.narrow_ready_control+" ready / "+r.narrow_blocked_control+" blocked");
  card(host,"Implemented book",r.book_allowed_candidate+" allowed",r.book_abstained_candidate+" valid abstentions · "+r.book_blocked_candidate+" blocked");
  const gap=s.summary.biggest_gap;
  const g=card(host,"Biggest data gap",gap?gap.field:"none",gap?gap.mornings+" of "+gap.sessions+" mornings ("+gap.share_pct+"%) · "+gap.first+" → "+gap.last:"");
  if(gap){el("small","what to obtain: "+(gap.candidate_action||gap.action||"—"),g)}
  card(host,"Next action",gap?"Close the "+gap.field+" gap":"Review the requirements",s.summary.next_to_obtain[0]||"");
}
function table(parent,headers,rows){
  const t=el("table",null,parent);
  const thead=el("thead",null,t),hr=el("tr",null,thead);
  for(const h of headers)el("th",h,hr);
  const tbody=el("tbody",null,t);
  for(const row of rows){const tr=el("tr",null,tbody);for(const cell of row){const td=el("td",null,tr);if(cell instanceof Node)td.append(cell);else td.textContent=cell===null||cell===undefined?"—":String(cell)}}
  return t;
}
function renderOverview(v,s){
  const pkg=s.package_identity;
  el("h2","What this run covers",v);
  el("p","Two legacy models and the supplied H1 candidate share one 05:00 London session contract. The rows below remain the legacy experiment; the H1 candidate has its own nine-input coverage audit under the H1 candidate tab and no legacy count is substituted for H1.",v);
  el("h3","Five counts, printed separately (OD-5)",v);
  const t=table(v,["Model","Scheduled","Reconstructed","Valid (strict)","Directional (engine)","Scored","Overlap / exclusions"],[]);
  const body=t.querySelector("tbody");
  for(const role of ["control","candidate"]){
    const m=s.coverage_trace.by_model[role];
    const tr=el("tr",null,body);
    const first=el("td",role+" ",tr);pill(role==="control"?"control":"legacy candidate",first);
    for(const value of [m.scheduled,m.reconstructed,m.valid_strict,m.directional,m.scored])el("td",value===null?"—":String(value),tr);
    const o=el("td",null,tr);
    el("small","both "+m.overlap.both+" · reconstructed only "+m.overlap.reconstructed_only+" · directional only "+m.overlap.directional_only,o);
    if(role==="candidate")el("small","scored sample: "+m.scored_basis,o);
  }
  el("p","Definitions: "+Object.entries(s.coverage_trace.definitions).map(([k,v])=>k+" = "+v).join("; ")+".",v,"caption");
  el("p",s.coverage_trace.strict_rule,v,"caption");

  el("h3","Control parity on spread, Fed bias, surprise and DXY",v);
  el("p",s.summary.parity.claim,v);
  const p=table(v,["Factor","Input","Mornings with a value","Coded / rulebook weight","Finding"],[]);
  const pb=p.querySelector("tbody");
  for(const f of s.summary.parity.factors){
    const tr=el("tr",null,pb);
    el("td",f.id+" "+f.factor,tr);
    el("td",f.input,tr);
    el("td",f.mornings_with_value+" / "+f.sessions,tr);
    el("td",f.weight.coded_24h+" / "+f.weight.rulebook,tr);
    const td=el("td",null,tr);el("small",f.finding,td);pill(f.status,td);
  }
  el("p","Verdict: "+s.summary.parity.verdict+". No production parity claim is made.",v,"caption");

  el("h3","What to obtain next",v);
  const ul=el("ul",null,v);for(const line of s.summary.next_to_obtain)el("li",line,ul);

  el("h3","The four tests",v);
  const grid=el("div",null,v,"grid");
  for(const test of s.tests.definitions){
    const c=card(grid,test.ordinal+". "+test.label,test.status,"usable "+(test.usable_sessions??0)+" of "+s.summary.sessions);
    el("small","outcome source: "+test.outcome_source,c);
  }
  el("p","Sealed live replay: not run. No sealed replay artefact exists in this checkout, so no live figure is reported here.",v,"caption");
}
function renderH1(v,s){
  const h=s.h1;
  el("h2","H1 candidate · nine-input coverage audit",v);
  if(!h){el("p","No H1 payload is present in this build. No legacy count is substituted for H1 coverage.",v);return}
  const c=h.coverage;
  const banner=el("div",null,v,"banner"+(c.ready>0?" ok":" bad"));
  el("strong",c.label,banner);
  el("p",h.model.label+" · "+h.model.id+" · "+h.model.version+" · rulebook "+h.model.rulebook_version+" · gate "+c.binding.gate+".",banner);
  el("p",h.package.consequence,banner);
  if(c.status==="blocked"||c.ready===0)el("p","This is a coverage audit, not a performance result. Fixtures prove engine admission only; they are not historical evidence.",banner);

  const grid=el("div",null,v,"grid");
  card(grid,"Scheduled mornings",String(c.scheduled),c.binding.run_id+" · "+c.binding.run_first_session+" → "+c.binding.run_last_session);
  card(grid,"H1 ready",String(c.ready),"eligible under all nine input contracts");
  card(grid,"H1 blocked",String(c.blocked),"earliest eligible: "+(c.earliest_eligible||"none"));
  card(grid,"Fixtures",h.fixtures.status,h.fixtures.label);
  card(grid,"Package",h.package.status,h.package.requested+" · "+h.package.verification);
  card(grid,"Receipts",String(c.receipts.recorded)+" recorded",c.receipts.note);

  el("h3","Input contract and measured coverage",v);
  el("p",c.basis+". Present is not eligible: a value must also retain its original observation, five-interval lookback, freshness, observation/publication/receipt clocks and identity.",v,"caption");
  const rows=[];
  for(const input of c.inputs){
    const contract=el("div");
    el("strong",input.label,contract);
    el("small",input.source+" · "+input.instrument,contract);
    el("small",input.transform,contract);
    const field=el("div");
    el("code",input.legacy_field,field);
    el("small","identity: "+input.identity_state,field);
    const present=el("div");
    el("strong",input.present+" / "+c.scheduled,present);
    el("small","named aliases "+input.named+" · original "+input.original,present);
    const missing=el("div");
    el("strong",String(input.missing),missing);
    if(input.incomplete)el("small","schedule incomplete "+input.incomplete,missing);
    if(input.missing_dates&&input.missing_dates.length)el("small","first missing: "+input.missing_dates.slice(0,5).join(", ")+(input.missing_dates.length>5?" …":""),missing);
    const lookback=el("div");
    el("strong",String(input.lookback),lookback);
    el("small","eligible rung "+input.eligible,lookback);
    const clocks=el("div");
    el("strong",input.clocked+" clocked",clocks);
    el("small","receipt "+input.receipt+" · "+input.clock_sample,clocks);
    const blocker=el("details");
    el("summary",input.code,blocker);
    el("p",input.blocker_text,blocker);
    el("p",input.acquisition,blocker,"caption");
    rows.push([contract,field,present,missing,lookback,clocks,blocker]);
  }
  table(v,["Declared input contract","Archived field","Present / scheduled","Missing / incomplete","Five-interval lookback","05:00 clocks","First blocker and what to acquire"],rows);

  el("h3","Why the archive cannot satisfy H1",v);
  const gaps=el("ul",null,v);
  for(const input of c.inputs)el("li",input.label+": "+input.availability+" Acquisition: "+input.acquisition,gaps);

  el("h3","Blocked-morning inspector",v);
  el("p","Every scheduled morning is listed. Choose a date to inspect the exact first blocker and failed rungs; the profile table below links the repeated signatures.",v);
  const picker=el("div",null,v,"chips");
  el("label","Morning ",picker);
  const select=el("select",null,picker);
  select.setAttribute("aria-label","H1 morning to inspect");
  for(const m of c.mornings){
    const o=el("option",m.date+" · "+(m.ready?"ready":"blocked"),select);
    o.value=m.date;
  }
  const detail=el("div",null,v,"card");
  const renderMorning=date=>{
    const m=c.mornings.find(x=>x.date===date);
    detail.replaceChildren();
    if(!m){el("p","No morning matches "+date+".",detail);return}
    const p=c.profiles[m.signature];
    const head=el("h3",m.date+" · "+(m.ready?"H1 ready":"H1 blocked"),detail);
    pill(m.ready?"eligible":"blocked",head);
    el("p","scheduled releases: "+m.calendar_count+" · profile: "+(p?p.dates.length:0)+" morning(s) share this signature.",detail);
    if(p){
      const rows=[];
      for(const b of p.blockers){
        const first=el("div");
        el("code",b.code,first);
        el("small","failed: "+b.failed_rungs.join(", "),first);
        const value=el("div");
        el("code",JSON.stringify(m.values[b.input]),value);
        el("small","identity: "+b.identity_state,value);
        const clock=el("div");
        el("small","observed "+(b.clock.observed||"—")+" · published "+(b.clock.published||"—")+" · received "+(b.clock.received||"—"),clock);
        el("small",b.clock.note,clock);
        const action=el("div");el("small",b.text,action);
        rows.push([b.label,value,clock,first,action]);
      }
      table(detail,["Input","Archived value","Clocks","First blocker","Why it fails"],rows);
      el("p","Profile signature: "+m.signature,detail,"caption");
    }
    const trace=el("details",null,detail);
    el("summary","Rung trace for this morning",trace);
    el("pre",JSON.stringify(m.rungs,null,2),trace);
  };
  select.onchange=()=>renderMorning(select.value);
  renderMorning(select.value);

  el("h3","Coverage profiles",v);
  const profileRows=[];
  for(const p of Object.values(c.profiles).sort((a,b)=>b.dates.length-a.dates.length)){
    const inspect=el("button","Inspect",el("div"));
    inspect.onclick=()=>{select.value=p.dates[0];renderMorning(p.dates[0]);select.scrollIntoView({block:"center"})};
    profileRows.push([String(p.dates.length),p.dates[0],p.dates[p.dates.length-1],p.blockers.map(b=>b.code).join(", "),inspect]);
  }
  table(v,["Mornings","First date","Last date","Blockers","Open"],profileRows);
  el("h3","Event calendar",v);
  const calgrid=el("div",null,v,"grid");
  card(calgrid,"Calendar status",c.event_calendar.status,c.event_calendar.version+" · "+c.event_calendar.events+" staged events");
  card(calgrid,"Sessions with a staged event",String(c.event_calendar.sessions_with_staged_event),"a zero count under a partial calendar proves no omission");
  card(calgrid,"Required types",String(c.event_calendar.required_types.length),c.event_calendar.required_types.join(", "));
  card(calgrid,"Missing types",String(c.event_calendar.missing_types.length),c.event_calendar.missing_types.join(", "));
  el("p",c.event_calendar.note,v,"caption");

  el("h3","Receipts and contracts",v);
  const contract=el("div",null,v,"grid");
  card(contract,"Observed / published / received",c.receipts.recorded+" receipts",c.receipts.reconstructed+" reconstructed · "+c.receipts.receipt_reconstructable_inputs+" of "+c.inputs.length+" inputs reconstructable");
  card(contract,"Contract check",c.contract_check.checked?"checked":"not checked",c.contract_check.inputs+" inputs · "+c.contract_check.mismatches.length+" mismatches · package "+c.contract_check.package_version);
  el("p",c.receipts.note,v,"caption");

  el("h3","Supplied fixture replay",v);
  el("p","Fixture reproduction is an engine-admission control. It is not historical evidence and does not move H1 coverage.",v);
  const fixtureRows=[];
  for(const item of h.fixtures.cases){
    const d=el("details");
    el("summary",item.match?"trace equal":"diff",d);
    el("p","expected",d);
    el("pre",JSON.stringify(item.expected,null,2),d);
    el("p","actual",d);
    el("pre",JSON.stringify(item.actual,null,2),d);
    if(item.diff)el("pre",JSON.stringify(item.diff,null,2),d);
    fixtureRows.push([item.id,item.model_id+" "+item.model_version,item.date,item.match?"MATCH":"DIFF",item.scope||item.label,d]);
  }
  table(v,["Case","Model","Date","Result","Scope","Trace"],fixtureRows);
  el("p",h.fixtures.label+" · controls "+h.fixtures.control+" · counts binding: "+(h.fixtures.counts_binding||"none")+".",v,"caption");

  el("h3","Package identity",v);
  const pkg=el("div",null,v,"grid");
  card(pkg,"Requested",h.package.requested,h.package.status+" · verified "+h.package.verified_on);
  card(pkg,"Package commit",h.package.package.commit.slice(0,12)+"…",h.package.package.root+" · "+h.package.package.byte_policy);
  card(pkg,"Declared sums",h.package.internal_checksums.verified+" / "+h.package.internal_checksums.declared,"mismatches "+h.package.internal_checksums.mismatches.length);
  card(pkg,"Own verify.js",h.package.acceptance.status,h.package.acceptance.command+" · exit "+h.package.acceptance.exit_code+" · run "+h.package.acceptance.ran_on);
  card(pkg,"Rulebook sha256",h.package.declared_hashes.rulebook_sha256.slice(0,16)+"…","models "+h.package.declared_hashes.models_sha256.slice(0,12)+"… · inputs "+h.package.declared_hashes.inputs_sha256.slice(0,12)+"…");
  card(pkg,"Archive receipt",h.package.archive.sha256.slice(0,16)+"…",h.package.archive.role+" · "+h.package.archive.bytes+" bytes");
  card(pkg,"Frozen contents",h.package.contents.rows+" rows",h.package.contents.inputs+" inputs · "+h.package.contents.fixtures.length+" fixtures · "+h.package.contents.rows_status);
  el("p",h.package.consequence,v,"caption");
  el("p","Binding: "+c.binding.model_id+" · "+c.binding.model_version+" · run "+c.binding.run_id+" ("+c.binding.run_version+") · gate "+c.binding.gate+". Legacy replacement: "+c.legacy_replacement.replacement_label+".",v,"caption");

function drawArchitectureMap(canvas,nodes,edges,onSelect){
  if(!window.THREE||!canvas)return null;
  const T=window.THREE;
  let renderer;
  try{renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:true})}catch{canvas.hidden=true;return null}
  const scene=new T.Scene();
  const camera=new T.PerspectiveCamera(45,1,0.1,100);camera.position.set(1,0,17);camera.lookAt(1,0,0);
  const group=new T.Group();scene.add(group);
  const positions={
    research:[-4.6,0,0],rulebook:[-3.0,0.6,0],candidate_package:[-1.9,1.5,0],adjudications:[-1.3,0.9,0],
    factor_combination:[0.4,0.3,0],datasets:[2.0,-0.4,0],
    supabase:[3.4,1.1,-0.6],n8n:[3.4,-1.1,-0.6],validation:[4.9,0,0],
    test_dxy_broker:[6.4,1.6,0],test_four_markets:[6.4,0.8,0],test_l2l_5r:[6.4,0,0],test_l2l_3r:[6.4,-0.8,0],test_dxy_official_series:[6.4,-1.6,0]
  };
  const colour={verified:0x7fd6b0,verified_with_gap:0xe3c36b,partial:0xe3a35c,unverified:0xd68b8b,blocked:0xc96f6f,scored_legacy:0x8fb7d6};
  const meshes=[];
  for(const node of nodes){
    const p=positions[node.id]||[0,0,0];
    const size=node.kind==="test"?0.22:node.kind==="connection"?0.26:0.32;
    const mesh=new T.Mesh(new T.IcosahedronGeometry(size,1),new T.MeshStandardMaterial({color:colour[node.status]||0x9fd6ff,roughness:.5,metalness:.15}));
    mesh.position.set(p[0],p[1],p[2]);mesh.userData.id=node.id;group.add(mesh);meshes.push(mesh);
  }
  scene.add(new T.AmbientLight(0xffffff,1.1));
  const key=new T.DirectionalLight(0xffffff,1.4);key.position.set(3,5,8);scene.add(key);
  const lineMaterial=new T.LineBasicMaterial({color:0x4f7080,transparent:true,opacity:.7});
  for(const [a,b] of edges){
    const pa=positions[a],pb=positions[b];if(!pa||!pb)continue;
    const geom=new T.BufferGeometry().setFromPoints([new T.Vector3(...pa),new T.Vector3(...pb)]);
    group.add(new T.Line(geom,lineMaterial));
  }
  const draw=()=>{
    const w=canvas.clientWidth||600,h=canvas.clientHeight||320;
    renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.render(scene,camera);
  };
  const resize=new ResizeObserver(draw);resize.observe(canvas);
  let dragging=false,moved=0,lastX=0,lastY=0;
  canvas.addEventListener("pointerdown",e=>{dragging=true;moved=0;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId);canvas.style.cursor="grabbing"});
  canvas.addEventListener("pointermove",e=>{
    if(!dragging)return;
    const dx=e.clientX-lastX,dy=e.clientY-lastY;moved+=Math.abs(dx)+Math.abs(dy);
    group.rotation.y+=dx*0.006;group.rotation.x=Math.max(-0.7,Math.min(0.7,group.rotation.x+dy*0.004));
    lastX=e.clientX;lastY=e.clientY;draw();
  });
  const end=e=>{
    if(!dragging)return;dragging=false;canvas.style.cursor="grab";
    if(moved>5)return;
    const rect=canvas.getBoundingClientRect(),ray=new T.Raycaster();
    ray.setFromCamera(new T.Vector2(2*(e.clientX-rect.left)/rect.width-1,1-2*(e.clientY-rect.top)/rect.height),camera);
    const hit=ray.intersectObjects(meshes)[0];
    if(hit)onSelect(hit.object.userData.id);
  };
  canvas.addEventListener("pointerup",end);
  canvas.addEventListener("pointercancel",()=>{dragging=false;canvas.style.cursor="grab"});
  canvas.style.cursor="grab";
  draw();
  disposeMap=()=>{resize.disconnect();meshes.forEach(m=>{m.geometry.dispose();m.material.dispose()});renderer.dispose();disposeMap=null};
  return {focus:id=>{const m=meshes.find(x=>x.userData.id===id);if(m){group.rotation.y=-(m.position.x-1)*0.08;draw()}}};
}

  for(const [k,val] of Object.entries(bands.tie_treatment))el("p",k+": "+val,tie,"caption");
  el("p","Frozen digest: ",v,"caption").append(Object.assign(document.createElement("code"),{textContent:bands.digest,className:"hash"}));

  el("h2","Adjudication-to-rule review",v);
  const m=s.mapping_review;
  el("p",m.verdict,v);
  const summary=el("div",null,v,"grid");
  card(summary,"Adjudications",String(m.summary.adjudications),"25 rows in the frozen book");
  card(summary,"Executable votes",String(m.summary.mapped_and_executable),"enforced by the implemented book");
  card(summary,"Declared, not implemented",String(m.summary.missing_implementation),"no executable rule");
  card(summary,"Visible hypotheses",String(m.hypotheses.length),"choices the adjudications did not settle");
  const md=el("details",null,v);el("summary","All 25 adjudications",md);
  table(md,["Factor","Treatment","Family","Signal","Enforced","Status"],m.rows.map(r=>[r.factor_id,r.treatment,r.family||"—",r.signal_id||"—",r.enforced_by_implemented_book?"yes":"no",r.status]));
  const hd=el("details",null,v);el("summary","Every introduced hypothesis",hd);
  table(hd,["Id","Hypothesis","Evidence","Status"],m.hypotheses.map(h=>[h.id,h.text,h.evidence,h.status]));
}

function render(){
  const host=document.querySelector("#view");host.replaceChildren();
  if(disposeMap){disposeMap();mapApi=null}
  const s=state.screen;
  if(!s){el("p",state.error?"The screen payload could not be loaded: "+state.error:"Loading the screen payload…",host);return}
  const keyName=Object.hasOwn(tabs,location.hash.slice(1))?location.hash.slice(1):"overview";
  for(const a of document.querySelectorAll("#tabs a")){
    if(a.hash==="#"+keyName)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");
  }
  if(keyName==="overview")renderOverview(host,s);
  else if(keyName==="architecture")renderArchitecture(host,s);
  else if(keyName==="tests")renderTests(host,s);
  else if(keyName==="ledger")renderLedger(host,s);
  else if(keyName==="audit")renderAudit(host,s);
  else if(keyName==="decisions")renderDecisions(host,s);
  else if(keyName==="h1")renderH1(host,s);
}
function renderProvenance(s){
  const host=document.querySelector("#provenance-body");host.replaceChildren();
  el("p","Payload digest: "+s.provenance.screen_sha256,host,"mono hash");
  el("p","Report digest: "+(s.provenance.report_sha256||"—"),host,"mono hash");
  const rows=s.provenance.inputs.map(i=>[i.path,String(i.bytes),i.sha256]);
  table(host,["Input","Bytes","sha256"],rows);
  el("p",s.provenance.note,host);
}
(function boot(){
  const nav=document.querySelector("#tabs");
  for(const [id,label] of Object.entries(tabs)){
    const a=el("a",label,nav);a.href="#"+id;
  }
  addEventListener("hashchange",render);
  fetch(payloadUrl).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(json=>{
    state.screen=json;
    document.querySelector("#subtitle").textContent=json.subtitle;
    renderBlockers(json);renderSummary(json);renderProvenance(json);render();
  }).catch(error=>{state.error=error.message;render()});
})();







</script></body></html>
